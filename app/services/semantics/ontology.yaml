version: 4

# `meta.cost_model` (US-2 도입) — treatment cost 의 단일 진실.
# code 안의 magic constant 금지. 모든 가중치는 본 yaml 에서 derive 한다.
meta:
  cost_model:
    # priority component: relaxation_priority 값 그대로 cost 에 가산
    components:
      priority:
        derivation: relaxation_priority   # 값 그대로 (1~5)
      scope_explosion:
        low: 0
        medium: 1
        high: 2
      tier:
        T0: 999   # config integrity — 사실상 풀 수 없음 (last resort)
        T1: 10    # 안전/nurse welfare — 강하게 피함
        T2: 0     # 운영 — 정상 후보
        T3: -1    # 품질 soft — 더 선호
      causal_layer:
        meta: 999       # config 모순 — data fix 필요
        data: 5         # master data 수정 — 마찰 큼
        policy: 0       # 사용자 정책 — 풀어도 됨
        personal: 0     # 개인 cap — 풀어도 됨
        structural: 2   # 시스템 룰 — 가벼운 마찰
    # 매칭된 conflict_scenario 1건당 cost 감소 (선호)
    scenario_match_bonus: -1
    # bundle overhead — bundle 안 atomic treatment 1개당 추가되는 협의 비용
    # (treatments 가 N 개면 overhead = bundle_overhead_per_extra * (N - 1))
    bundle_overhead_per_extra: 0
    # ward profile multiplier — forbid 는 None (= ∞, 후보 제거)
    ward_profile_multipliers:
      forbid: null
      avoid: 5.0
      neutral: 1.0
      prefer: 0.3
    # ontology 에 priority/scope/tier/layer 가 누락된 family 의 fallback
    defaults:
      priority: 3
      scope_explosion: medium
      tier: T2
      causal_layer: structural
  # causal_layer 가 yaml 의 family 에 명시되지 않으면 parent 로부터 도출
  parent_to_default_causal_layer:
    CoverageConstraint: policy
    NurseLocalConstraint: structural
    CouplingConstraint: personal
    OverridePolicy: personal
    MetaConstraint: meta

# `relaxation_priority` (1~5): conflict probe 가 어느 family 를 먼저 풀어볼지 정렬할 때 사용.
#   1 = 가장 먼저 풀음 (영향 가벼움)
#   5 = 절대 안 풀음 (nurse welfare / 안전)
# `scope_explosion` (low/medium/high): 인스턴스 수의 자릿수.
#   low    = nurse 수 또는 그 이하
#   medium = nurse × day 미만
#   high   = nurse × day × shift 등
# `tier` (T0/T1/T2/T3): hard 제약 4-tier 계층화.
#   T0 = 절대/물리 hard - 수학적 불가능, family가 아닌 진단 결과로 도달 (ConfigIntegrity 만 family-level)
#   T1 = 안전 hard - 풀지 않음 (환자/간호사 안전·법규·사용자 명시적 결정)
#   T2 = 운영 hard - 정책성, 풀 수 있으나 결과 추적 필요
#   T3 = 품질 soft - 분배 균형·선호 (현재 v3 에서는 family 정의 없음)
# tier ↔ relaxation_priority 정렬:
#   T0: ConfigIntegrity + structural_diagnosis 의 HARD_IMPOSSIBLE_CODES 매칭 시
#   T1: priority 5 family
#   T2: priority 1~4 family
#   T3: (예정)

constraints:
  CoverageMin:
    label: Coverage Minimum
    parent: CoverageConstraint
    scope: [day, shift]
    effective_modes: [enforced, soft_fallback, inactive, precheck_blocked]
    connects: [AssignmentAtom, Day, Shift]
    explanation_template: "{day} {shift}는 최소 {min_required}명이 필요합니다."
    aliases: [GLOBAL_DAY_CAPACITY_SHORTAGE, GLOBAL_SHIFT_ALLOWED_SHORTAGE, CAPACITY_TOTAL_SHORTAGE, NO_ASSIGNMENT]
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: medium

  TeamMin:
    label: Team Minimum Coverage
    parent: CoverageConstraint
    scope: [team, day, shift]
    effective_modes: [enforced, skipped_by_capacity, soft_fallback, inactive, precheck_blocked]
    connects: [AssignmentAtom, Team, Day, Shift]
    explanation_template: "{day} {shift}에서 {team}은 최소 {min_required}명이 필요합니다."
    aliases: [TEAM_MIN_EXCEEDS_GLOBAL_NEED, TEAM_SIZE_INSUFFICIENT, TEAM_ACTIVE_MEMBERS_INSUFFICIENT, TEAM_SHIFT_ALLOWED_SHORTAGE, FIXED_ASSIGN_BREAKS_TEAM_MIN]
    default_severity: hard
    relaxation_priority: 2
    tier: T2
    scope_explosion: high

  GradeMin:
    label: Grade Minimum Coverage
    parent: CoverageConstraint
    scope: [grade, day, shift]
    effective_modes: [enforced, soft_fallback, inactive, precheck_blocked]
    connects: [AssignmentAtom, Grade, Day, Shift]
    explanation_template: "{day} {shift}에서 {grade}는 최소 {min_required}명이 필요합니다."
    aliases: [GRADE_MIN_SUM_EXCEEDS_NEED, GRADE_MIN_AVAILABLE_SHORTAGE]
    default_severity: hard
    relaxation_priority: 3
    tier: T2
    scope_explosion: high

  GradeMax:
    label: Grade Maximum Coverage
    parent: CoverageConstraint
    scope: [grade, day, shift]
    effective_modes: [enforced, soft_fallback, inactive, precheck_blocked]
    connects: [AssignmentAtom, Grade, Day, Shift]
    explanation_template: "{day} {shift}에서 {grade}는 최대 {max_allowed}명까지 가능합니다."
    aliases: [GRADE_MAX_SUM_BELOW_NEED, GRADE_ANTIPAIR_FORCES_SHORTAGE]
    default_severity: hard
    relaxation_priority: 2
    tier: T2
    scope_explosion: high

  ConsecutiveWorkLimit:
    label: Consecutive Work Limit
    parent: NurseLocalConstraint
    scope: [nurse, day_window]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "{nurse}는 최대 연속근무일 {max_days}일을 초과할 수 없습니다."
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: medium

  ConsecutiveNightLimit:
    label: Consecutive Night Limit
    parent: NurseLocalConstraint
    scope: [nurse, day_window]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "{nurse}는 최대 연속 나이트 수를 초과할 수 없습니다."
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: medium

  NightRecovery:
    label: Night Recovery
    parent: NurseLocalConstraint
    scope: [nurse, day_window]
    effective_modes: [enforced, bypassed_by_fixed, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    produces: [ForcedOff]
    explanation_template: "{nurse}는 N 블록 이후 회복 OFF가 필요합니다."
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: medium

  MonthlyNightCap:
    label: Monthly Night Cap
    parent: NurseLocalConstraint
    scope: [nurse, month]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Month]
    explanation_template: "{nurse}의 월 N 합계는 {max_count}을 초과할 수 없습니다."
    aliases: [MONTHLY_NIGHT_CAPACITY_SHORTAGE]
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: low

  BanNightBeforeFixedOff:
    label: Ban Night Before Fixed Off
    parent: NurseLocalConstraint
    scope: [nurse, day]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "{nurse}의 휴가/공가 fixed 셀 직전일에는 N 시프트 금지 (휴가/공가 보호)."
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: low
    notes: "Trigger 한정: (n, d) 의 fixed_type ∈ {휴가, 공가}. fixed_wanted O / 휴무 / 주휴 등은 trigger 안 함. Bypass: (n, d-1) 이 이미 fixed (fixed_wanted 포함) 이면 ban 룰 스킵 — 사용자가 명시적으로 N 직후 휴가/공가 fixed 조합을 둔 것은 의도로 간주. config flag: ban_night_before_fixed_off (default True)."

  WeekendOffOnly:
    label: Weekend Off Only
    parent: NurseLocalConstraint
    scope: [nurse, weekday]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "{nurse}는 평일 OFF 금지 + 주말 OFF 보장 (주말휴무 정책)."
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: medium

  OffCap:
    label: Off Cap
    parent: NurseLocalConstraint
    scope: [nurse, month]
    effective_modes: [enforced, bypassed_by_fixed, inactive]
    connects: [AssignmentAtom, Nurse, Month]
    explanation_template: "{nurse}의 월 OFF 개수는 monthly_limits.o_exact (있으면) 또는 roster_config.off_days (없으면) 한도를 따름."
    aliases: [FIXED_OFF_EXCEEDS_SPAN]
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: low
    notes: "Source priority: monthly_limit_constraints.o_exact (per-nurse exact) → roster_config.off_days (group fallback)."

  OffWindow:
    label: Off Window (cross-month / mid-month boundary)
    parent: NurseLocalConstraint
    scope: [nurse, day_window]
    effective_modes: [enforced, bypassed_by_fixed, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "{nurse}의 [{window}] 구간 OFF 강제 — 전월 N tail / 전월 연속근무 tail / 월경계 inherited recovery."
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: low
    notes: "Derived from upstream NightRecovery (two_offs_after_two_nig / two_offs_after_three_nig) + ConsecutiveWorkLimit (max_consecutive_work_days) + month boundary handling. To remove OffWindow indirectly, adjust those upstream families instead — there is no direct disable for OffWindow."

  BoundaryTransitionBan:
    label: Boundary Transition Ban
    parent: NurseLocalConstraint
    scope: [nurse, boundary_day]
    effective_modes: [enforced, bypassed_by_fixed, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "경계일 직전 근무와 다음 근무 사이 전환 금지가 적용됩니다."
    aliases: []
    default_severity: hard
    relaxation_priority: 3
    tier: T2
    scope_explosion: high
    notes: "두 메커니즘이 같은 functional family. (a) Within-month: cp_sat_basic line 3267 의 transition pair m.Add. (b) Cross-month / mid-month: roster_create_service 가 initial_constraints.forbidden 으로 single-cell forbid 변환 후 enforce. 후자는 cross-month source 로 metadata 태깅 권장."

  AllowedShiftMask:
    label: Allowed Shift Mask
    parent: NurseLocalConstraint
    scope: [nurse, day, shift]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day, Shift]
    explanation_template: "{nurse}는 허용되지 않은 shift 를 가질 수 없습니다."
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: high

  NotOneNight:
    label: Not One Night
    parent: NurseLocalConstraint
    scope: [nurse, day]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "1N (단발성 N) 금지 — N 배정 시 인접일 중 하나는 N 이어야 합니다."
    default_severity: hard
    relaxation_priority: 3
    tier: T2
    scope_explosion: medium

  PrecepteeSync:
    label: Preceptee Sync
    parent: CouplingConstraint
    scope: [preceptor, preceptee, day]
    effective_modes: [enforced, inactive]
    connects: [AssignmentAtom, Nurse, Day]
    explanation_template: "프리셉티는 지정 기간 동안 프리셉터와 동일 근무여야 합니다."
    default_severity: hard
    relaxation_priority: 4
    tier: T2
    scope_explosion: medium

  AssignmentWindow:
    label: Assignment Window
    parent: CouplingConstraint
    scope: [nurse, assignment_period]
    effective_modes: [enforced, inactive]
    connects: [Assignment, Day, Nurse]
    explanation_template: "기간 파견/이동 구간에서 소유 group 및 허용 shift가 바뀝니다."
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: low

  CarryoverBoundary:
    label: Carryover Boundary
    parent: CouplingConstraint
    scope: [nurse, boundary_day]
    effective_modes: [enforced, inactive]
    connects: [ScheduleSnapshot, Nurse, Day]
    explanation_template: "이전 스케줄 tail 상태를 경계일에 이어받습니다."
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: low

  FixedWanted:
    label: Fixed Wanted
    parent: OverridePolicy
    scope: [nurse, day, shift]
    effective_modes: [enforced, bypassed_by_fixed, inactive]
    connects: [WantedEntry, AssignmentAtom, Day, Nurse]
    explanation_template: "확정 원티드는 일부 제약을 우회하거나 회복 슬롯을 막을 수 있습니다."
    default_severity: hard
    relaxation_priority: 5
    tier: T1
    scope_explosion: medium

  ConfigIntegrity:
    label: Configuration Integrity
    parent: MetaConstraint
    scope: [config, group, month]
    effective_modes: [precheck_blocked, inactive]
    connects: [RosterConfig, GradeConfig]
    explanation_template: "설정 정합성 오류로 인해 생성 전 차단됩니다."
    aliases: [MID_DISABLED_BUT_USED, MID_REQUIRED_MISSING, ALLOWED_SHIFTS_ISOLATES_NURSE, FIXED_ASSIGN_EXCEEDS_NEED, FIXED_ASSIGN_VIOLATES_ALLOWED]
    default_severity: hard
    relaxation_priority: 5
    tier: T0
    scope_explosion: low

overrides:
  FixedWanted:
    label: Fixed Wanted Override
    parent: OverridePolicy
    # bypasses 정정 (Q6):
    #   - 'InitialForbiddenOverride' 제거: 본질적으로 BoundaryTransitionBan 의 cross-month 확장이라 중복.
    #   - 'ProfileShiftLimit' → 'AllowedShiftMask' 로 통합 (같은 의미의 다른 이름).
    bypasses: [BoundaryTransitionBan, AllowedShiftMask, BanNightBeforeFixedOff]
    does_not_bypass: [ConsecutiveWorkLimit, OffCap, NightRecovery, MonthlyNightCap]
    conditional_effects:
      blocks_recovery_slot: true
      counts_to_coverage: policy_dependent
      affects_preceptee_sync: policy_dependent

modes:
  enforced:
    label: Enforced
    meaning: 실제 solver 또는 precheck에서 hard로 적용된 상태
    is_enforced: true
    severity: hard
  soft_fallback:
    label: Soft Fallback
    meaning: retry 또는 fallback 경로에서 hard가 soft objective로 내려간 상태
    is_enforced: false
    severity: soft
  skipped_by_capacity:
    label: Skipped by Capacity
    meaning: 후보 또는 active member 부족으로 constraint가 실제 추가되지 않은 상태
    is_enforced: false
    severity: hard
  bypassed_by_fixed:
    label: Bypassed by Fixed
    meaning: fixed 또는 fixed_wanted로 인해 특정 제약이 우회된 상태
    is_enforced: false
    severity: hard
  inactive:
    label: Inactive
    meaning: 설정 또는 실행 경로상 비활성 상태
    is_enforced: false
    severity: none
  precheck_blocked:
    label: Precheck Blocked
    meaning: solver build 이전 precheck 단계에서 차단된 상태
    is_enforced: true
    severity: hard

relations:
  applies_to:
    source: Constraint
    target: RuntimeFact
  bypasses:
    source: OverridePolicy
    target: Constraint
  cannot_bypass:
    source: OverridePolicy
    target: Constraint
  carries_state:
    source: AssignmentWindow
    target: CarryoverBoundary

# 구체적 hard 충돌 상황 카탈로그 — conflict_probe 가 매칭/제안 근거로 사용.
# 각 시나리오:
#   id              : 안정적 식별자 (snake_case 대문자)
#   involved_families : 충돌에 관여한 family 들 (ontology constraint id)
#   trigger_condition : 어떤 조건에서 발생하는가 (자연어 + 측정 가능 힌트)
#   why_infeasible    : 왜 솔버가 풀 수 없는가
#   suggested_relaxation : 어떤 모듈을 어떻게 조절하면 풀리는가
#   detection_hint    : 자동 매칭 시 어떤 신호를 봐야 하는가
conflict_scenarios:
  - id: BTBAN_VS_FIXED_SEQUENCE
    involved_families: [BoundaryTransitionBan, FixedWanted]
    trigger_condition: |
      fixed_wanted 가 (D-1=N, D=D) 또는 (D-1=E, D=D) 시퀀스를 강제하면서
      해당 시퀀스가 BoundaryTransitionBan 의 bypass 매트릭스에 명시되지 않은 경우.
    why_infeasible: |
      두 fixed cell 이 transition ban 을 피하지 못해 모델이 UNSAT.
    suggested_relaxation: |
      FixedWanted 셀 검토 후 시퀀스 수정, 또는 BoundaryTransitionBan
      해당 nurse-day pair 에 한해 일시 disable.
    detection_hint: |
      emit 에서 mode=enforced 인 BoundaryTransitionBan 노드의
      related_atom_keys 가 두 atom 모두 fixed_cells 와 겹치는 케이스 카운트.

  - id: OFFCAP_VS_WEEKEND_OFF_NARROW_WINDOW
    involved_families: [OffCap, WeekendOffOnly, AssignmentWindow]
    trigger_condition: |
      WeekendOffOnly 적용 nurse 의 active_days (파견/병동이동/휴직 클리핑 후) 가
      OffCap min 보다 좁고, 그 active 윈도우 안의 weekend slot 수가 OffCap min 미만.
    why_infeasible: |
      OFF 강제 슬롯이 cap 을 못 채움. 평일은 O 금지이므로 OFF 추가 배정 불가.
    suggested_relaxation: |
      해당 nurse 의 OffCap 완화 (set_threshold) 또는
      AssignmentWindow 의 active 일자 확대.
    detection_hint: |
      preflight_alerts 의 weekend_slot_shortage 메시지 + 해당 nurse 의 active_day 수
      < off_cap_min.

  - id: NIGHT_RECOVERY_VS_COVERAGE_MIN
    involved_families: [NightRecovery, CoverageMin, TeamMin]
    trigger_condition: |
      특정 nurse 의 2N/3N 블록 직후 recovery OFF 가 강제된 일자에
      해당 day 의 CoverageMin 또는 TeamMin slack 이 0 또는 음수.
    why_infeasible: |
      복수 nurse 의 recovery OFF 가 같은 날에 몰려 D/E/N 인력이 부족.
    suggested_relaxation: |
      CoverageMin 의 해당 day 일시 soft 강등, 또는 N 블록 분산
      (다른 nurse 의 N 일자 변경).
    detection_hint: |
      block_end_day 와 day-level coverage slack ≤ 0 의 교집합 카운트.

  - id: TEAM_MIN_VS_GRADE_MAX_INTERSECTION
    involved_families: [TeamMin, GradeMax]
    trigger_condition: |
      특정 team 의 minimum 인원 요구가 그 day/shift 의 GradeMax 한도와
      교집합에서 빈자리를 만들지 못하는 경우 (등급 X 가 필요한데 GradeMax 가 그 등급 막음).
    why_infeasible: |
      TeamMin 만족하려면 등급 X 가 필요한데 GradeMax 가 추가 배정 차단.
    suggested_relaxation: |
      GradeMax 의 해당 grade soft 강등 (force_soft_mode), 또는
      TeamMin 의 해당 team 일시 disable.
    detection_hint: |
      team membership ∩ grade 의 교집합 사이즈 < TeamMin.

  - id: ALLOWED_SHIFT_MASK_VS_TEAM_MIN
    involved_families: [AllowedShiftMask, TeamMin]
    trigger_condition: |
      해당 team 의 active member 중 night-only / day-only 등 제한된
      AllowedShiftMask 를 가진 nurse 비율이 높아 다른 shift 의 TeamMin 충족 불가.
    why_infeasible: |
      AllowedShiftMask 가 hard 라 nurse 가 다른 shift 로 이동 불가,
      그 결과 TeamMin 이 다른 shift 에서 인원 부족.
    suggested_relaxation: |
      특정 nurse 의 AllowedShiftMask 임시 완화 또는 TeamMin disable.
    detection_hint: |
      team 별로 AllowedShiftMask 합집합이 요구 shift 를 모두 cover 하지 못하는 케이스.

  - id: NOT_ONE_NIGHT_VS_FIXED_OFF_NEIGHBOR
    involved_families: [NotOneNight, FixedWanted]
    trigger_condition: |
      특정 nurse 의 day D 에 N 이 배정 가능하지만, 인접일 D-1, D+1 모두
      fixed off 또는 fixed non-N 으로 잠겨 1N 회피 불가.
    why_infeasible: |
      NotOneNight 가 인접일 N 을 요구하는데 인접 fixed 가 그것을 막음.
    suggested_relaxation: |
      해당 nurse-day 의 NotOneNight 일시 비활성, 또는 fixed_wanted 인접일 수정.
    detection_hint: |
      D 에 N 후보가 있고 D-1, D+1 fixed 가 N 외의 값으로 잠긴 케이스.


# ─────────────────────────────────────────────────────────────────────────
# US-6 (Ontology v4) — Cause / Treatment 카탈로그
# 사용자 핵심 요구:
#   - cause vs symptom 어휘 분리 (cause 만 reason_code 로 노출)
#   - treatment 의 rationale_ko / trade_off_ko 필수 (자연어 사용자 메시지)
#   - cause-treatment edge 가 동적 hitting set 의 입력 (US-4)
#   - "인원 줄이면 됨" 류 naive 추천 금지 — 모든 treatment 가 구체 config 키 + direction 명시
# ─────────────────────────────────────────────────────────────────────────

causes:
  cause:capacity:monthly_total_shortage:
    label: "월 총 공급 < 수요"
    category: capacity
    causal_layer: policy
    tier: T0
    is_hard: true
    aliases: [CAPACITY_TOTAL_SHORTAGE]
    problem_template_ko: "월 총 필요 슬롯 {required}개가 공급 상한 {capacity}개를 {shortage}개 초과합니다."

  cause:capacity:monthly_night_shortage:
    label: "월간 N 수요 > N capacity"
    category: capacity
    causal_layer: policy
    tier: T0
    is_hard: true
    aliases: [MONTHLY_NIGHT_CAPACITY_SHORTAGE]
    problem_template_ko: "월간 N 수요 {n_required}회가 N 상한 용량 {n_capacity}회를 초과합니다."

  cause:capacity:daily_night_shortage:
    label: "일별 N 수요 > N capacity"
    category: capacity
    causal_layer: policy
    tier: T0
    is_hard: true
    aliases: [N_CAPACITY_SHORTAGE]
    problem_template_ko: "야간 일 수요 {n_required}명이 야간 가용 인력을 초과합니다."

  cause:capacity:daily_total_shortage:
    label: "day 총 수요 > 간호사 수"
    category: capacity
    causal_layer: policy
    tier: T0
    is_hard: true
    aliases: [GLOBAL_DAY_CAPACITY_SHORTAGE, DAILY_DEMAND_EXCEEDS_NURSE_COUNT]
    problem_template_ko: "{day}일 총 근무 수요 {total_demand}명이 간호사 수 {nurse_count}명을 초과합니다."

  cause:eligibility:shift_eligible_shortage:
    label: "shift 가능 인력 < 일 수요"
    category: eligibility
    causal_layer: data
    tier: T1
    is_hard: true
    aliases: [GLOBAL_SHIFT_ALLOWED_SHORTAGE]
    problem_template_ko: "{day}일 {shift} 가능 간호사 수 {eligible}명이 수요 {required}명 미만입니다."

  cause:eligibility:nurse_isolated:
    label: "간호사 전 시프트 차단"
    category: eligibility
    causal_layer: data
    tier: T0
    is_hard: true
    aliases: [ALLOWED_SHIFTS_ISOLATES_NURSE]
    problem_template_ko: "간호사 {nurse_id}의 allowed_shifts 가 비어있어 어떤 시프트도 배정 불가합니다."

  cause:config:mid_required_missing:
    label: "MID 필요한데 daily 요구에 없음"
    category: config
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [MID_REQUIRED_MISSING]
    problem_template_ko: "use_mid=True 이지만 daily_shift_requirements 에 M 항목이 누락되었습니다."

  cause:config:mid_disabled_but_used:
    label: "MID 비활성인데 참조됨"
    category: config
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [MID_DISABLED_BUT_USED]
    problem_template_ko: "use_mid=False 이지만 team/grade 제약에 M 가 참조됩니다."

  cause:config:grade_min_gt_max:
    label: "grade_min > grade_max"
    category: config
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [GRADE_MIN_EXCEEDS_MAX]
    problem_template_ko: "grade {grade} 의 min({min_val}) > max({max_val}) — 산술 모순."

  cause:config:monthly_limit_contradiction:
    label: "monthly_limit min > max"
    category: config
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [MONTHLY_LIMIT_MIN_EXCEEDS_MAX]
    problem_template_ko: "간호사 {nurse_id} {shift} 월 min({min_val}) > max({max_val}) — 산술 모순."

  cause:fixed:over_demand:
    label: "fixed 배정 > 일 수요"
    category: fixed
    causal_layer: personal
    tier: T1
    is_hard: true
    aliases: [FIXED_ASSIGN_EXCEEDS_NEED]
    problem_template_ko: "{day}일 {shift} fixed 배정 {fixed_count}명이 수요 {required}을 초과합니다."

  cause:fixed:violates_eligibility:
    label: "fixed 가 allowed_shifts 위반"
    category: fixed
    causal_layer: personal
    tier: T0
    is_hard: true
    aliases: [FIXED_ASSIGN_VIOLATES_ALLOWED]
    problem_template_ko: "간호사 {nurse_id}의 fixed {shift} 배정이 allowed_shifts 를 위반합니다."

  cause:fixed:off_exceeds_span:
    label: "fixed OFF / OFF 예산 > active span"
    category: fixed
    causal_layer: personal
    tier: T1
    is_hard: true
    aliases: [FIXED_OFF_EXCEEDS_SPAN, OFF_BUDGET_EXCEEDS_NUM_DAYS]
    problem_template_ko: "간호사 {nurse_id} fixed OFF / 예산 {total}일이 활성 일수 {span}을 초과합니다."

  cause:grade:min_sum_over_need:
    label: "grade_min 합 > 일 수요"
    category: grade
    causal_layer: policy
    tier: T2
    is_hard: true
    aliases: [GRADE_MIN_SUM_EXCEEDS_NEED, GRADE_MIN_AVAILABLE_SHORTAGE]
    problem_template_ko: "{day}일 {shift} grade_min 합 {min_sum}이 수요 {required}을 초과합니다."

  cause:grade:max_sum_below_need:
    label: "grade_max 합 < 일 수요"
    category: grade
    causal_layer: policy
    tier: T2
    is_hard: false
    aliases: [GRADE_MAX_SUM_BELOW_NEED, GRADE_ANTIPAIR_FORCES_SHORTAGE]
    problem_template_ko: "{day}일 {shift} grade_max 합 {cap}이 수요 {required}을 미달합니다."

  cause:team:min_over_need:
    label: "team_min 합 > 일 수요"
    category: team
    causal_layer: policy
    tier: T2
    is_hard: true
    aliases: [TEAM_MIN_EXCEEDS_GLOBAL_NEED]
    problem_template_ko: "{day}일 {shift} team_min 합 {min_sum}이 daily 수요 {required}을 초과합니다."

  cause:team:size_insufficient:
    label: "팀 크기 < team_min"
    category: team
    causal_layer: data
    tier: T0
    is_hard: true
    aliases: [TEAM_SIZE_INSUFFICIENT, TEAM_MIN_EXCEEDS_TEAM_SIZE]
    problem_template_ko: "팀 {team_id} 크기({size})가 팀 최소 {team_min} 미만입니다."

  cause:undiagnosed:
    label: "원인 미식별 (UNDIAGNOSED sentinel)"
    category: undiagnosed
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [UNDIAGNOSED]
    problem_template_ko: "솔버 infeasible 이지만 어떤 cause probe 도 root 를 식별 못 함. evidence 의 raw validator output 으로 수동 분석 필요."

  # ─────────────────────────────────────────────────────────────────────
  # Dispatch (파견/병동이동) 전용 cause 4종
  # 일반 cause (fixed/team/eligibility) 와 구별되는 cross-group 진단.
  # ─────────────────────────────────────────────────────────────────────
  cause:dispatch:inbound_window_too_narrow:
    label: "파견 입주(inbound) 활성 기간 부족"
    category: dispatch
    causal_layer: data
    tier: T1
    is_hard: true
    aliases: [DISPATCH_INBOUND_WINDOW_NARROW, INBOUND_ACTIVE_DAYS_INSUFFICIENT]
    problem_template_ko: "파견 입주 간호사 {nurse_id} 활성 기간 {active_days}일이 본 병동 {target_constraint} 충족에 필요한 {needed_days}일에 미달합니다."

  cause:dispatch:outbound_leaves_source_short:
    label: "파견 송출(outbound) 로 source 병동 부족 발생"
    category: dispatch
    causal_layer: data
    tier: T1
    is_hard: true
    aliases: [DISPATCH_OUTBOUND_SOURCE_SHORT, OUTBOUND_DRAINS_SOURCE]
    problem_template_ko: "파견 송출 간호사 {nurse_id} 송출 기간 {start_day}~{end_day} 동안 본 병동 {affected_constraint} {shortage}명 부족 발생."

  cause:dispatch:inbound_shift_mask_incompatible:
    label: "파견 입주 간호사의 허용 시프트 불일치"
    category: dispatch
    causal_layer: data
    tier: T0
    is_hard: true
    aliases: [DISPATCH_INBOUND_SHIFT_INCOMPAT, INBOUND_ALLOWED_SHIFT_MISMATCH]
    problem_template_ko: "파견 입주 간호사 {nurse_id} 가능 시프트 {allowed_shifts}가 본 병동 부족 시프트 {needed_shifts}를 cover 하지 못합니다."

  cause:dispatch:fixed_assign_wrong_group:
    label: "파견 입주 fixed 배정의 group ownership 충돌"
    category: dispatch
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [DISPATCH_FIXED_GROUP_MISMATCH, INBOUND_FIXED_CROSS_GROUP]
    problem_template_ko: "파견 입주 간호사 {nurse_id} 의 fixed 배정이 source group({source_group_id}) 과 target group({target_group_id}) 간 충돌. {day}일 {shift}."

  # ─────────────────────────────────────────────────────────────────────
  # Carryover (월경계) — 전월 schedule tail 이 본 월 시작 day 차단
  # ─────────────────────────────────────────────────────────────────────
  cause:carryover:prev_month_n_tail_blocks_start:
    label: "전월 N tail 로 본 월 시작 day 전이 차단"
    category: carryover
    causal_layer: structural
    tier: T1
    is_hard: true
    aliases: [PREV_MONTH_N_TAIL_BLOCKS, CARRYOVER_PREV_MONTH_TRANSITION]
    problem_template_ko: "간호사 {nurse_id} 가 전월 마지막 일에 N 배정 → 본 월 day {day} 에서 N→{shift} 전이 금지 적용, 그 day 배정 불가."

  cause:carryover:fixed_n_isolated_by_off_neighbors:
    label: "fixed N 인접 OFF 로 NotOneNight 위반 강제"
    category: carryover
    causal_layer: structural
    tier: T1
    is_hard: true
    aliases: [CARRYOVER_FIXED_N_ISOLATION, FIXED_N_NEIGHBOR_OFF]
    problem_template_ko: "간호사 {nurse_id} 의 {day}일 fixed N 양옆 ({prev_day}, {next_day}) 이 OFF 강제 → 1N 회피(NotOneNight) 충족 불가."

  # ─────────────────────────────────────────────────────────────────────
  # Transition Ban — 시프트 전이 금지 (N→D, E→D, N→E 등)
  # ─────────────────────────────────────────────────────────────────────
  cause:transition:nod_pattern_forces_infeasibility:
    label: "N→OFF→D 패턴 hard 와 인접 fixed 충돌"
    category: transition
    causal_layer: structural
    tier: T2
    is_hard: true
    aliases: [TRANSITION_BAN_NOD_CHAIN, NOD_PATTERN_BLOCKS]
    problem_template_ko: "간호사 {nurse_id} 의 {day}일 N 후속 day 의 D 배정 필요 (fixed 또는 demand) → N→OFF→D 또는 N→D 전이 금지 위반."

  # ─────────────────────────────────────────────────────────────────────
  # Recovery OFF — 2N→2OFF, 3N→2OFF 회복 강제로 day d+2~d+3 demand 부족
  # ─────────────────────────────────────────────────────────────────────
  cause:recovery:two_n_two_off_blocks_demand:
    label: "2N→2OFF 회복으로 후속 일 demand 미충족"
    category: recovery
    causal_layer: structural
    tier: T1
    is_hard: true
    aliases: [RECOVERY_2N2OFF_BLOCKS, TWO_N_RECOVERY_DEMAND_GAP]
    problem_template_ko: "{day_a}~{day_b}일 2N 배정 간호사 {nurses}명 → 후속 {day_c}~{day_d}일 OFF 강제, 그 기간 {affected_shift} 수요 {shortage}명 부족."

  cause:recovery:three_n_two_off_blocks_demand:
    label: "3N→2OFF 회복으로 후속 일 demand 미충족"
    category: recovery
    causal_layer: structural
    tier: T1
    is_hard: true
    aliases: [RECOVERY_3N2OFF_BLOCKS, THREE_N_RECOVERY_DEMAND_GAP]
    problem_template_ko: "{day_a}~{day_c}일 3N 배정 간호사 {nurses}명 → 후속 {day_d}~{day_e}일 OFF 강제, 그 기간 {affected_shift} 수요 {shortage}명 부족."

  # ─────────────────────────────────────────────────────────────────────
  # Preceptee — 페어 동기화로 두 사람 자유도 손실
  # ─────────────────────────────────────────────────────────────────────
  cause:preceptee:sync_window_mismatch:
    label: "프리셉터-프리셉티 동기화 vs 가능 시프트/팀 불일치"
    category: preceptee
    causal_layer: personal
    tier: T2
    is_hard: true
    aliases: [PRECEPTEE_SYNC_MISMATCH, PAIR_SYNC_INCOMPATIBLE]
    problem_template_ko: "프리셉터 {preceptor_id} 와 프리셉티 {preceptee_id} 동기화 기간 {start_day}~{end_day} 동안 두 사람의 가능 시프트/팀 intersection 이 비어 동시 배정 불가."

  # ─────────────────────────────────────────────────────────────────────
  # Consecutive Work/Night — 연속 근무/야간 한도 강제로 windowed coverage 불능
  # ─────────────────────────────────────────────────────────────────────
  cause:consecutive:work_limit_blocks_coverage:
    label: "max_consecutive_work 강제로 windowed coverage 부족"
    category: consecutive
    causal_layer: structural
    tier: T2
    is_hard: true
    aliases: [CONSECUTIVE_WORK_LIMIT_BLOCKS, MAX_CONSEC_WORK_INFEASIBLE]
    problem_template_ko: "{day_a}~{day_b}일 ({window_days}일 구간) 에 max_consecutive_work({limit}) 강제로 모든 가용 간호사가 최소 1 OFF 필요 → 그 구간 {affected_shift} 수요 {shortage}명 부족."

  # ─────────────────────────────────────────────────────────────────────
  # Eligibility / Role 세분화 — AllowedShiftMask / WeekendOffOnly / BanNightBeforeFixedOff
  # ─────────────────────────────────────────────────────────────────────
  cause:eligibility:role_only_oversupply:
    label: "특정 role (예: N-only) 비율 과다 → 다른 shift 부족"
    category: eligibility
    causal_layer: data
    tier: T1
    is_hard: true
    aliases: [N_ONLY_ROLE_OVERSUPPLY, ROLE_ONLY_OVERSUPPLY, N_ONLY_VS_CAPS]
    problem_template_ko: "특정 role({role}) 만 가능한 간호사 {role_only_count}명이 해당 shift 수요 {role_demand}명을 초과 → 다른 shift {other_demand}명 수요에 가용 인원 {other_eligible}명 부족."

  cause:eligibility:weekend_off_only_drains_weekday:
    label: "주말 OFF 전용 비율 과다 → 평일 공급 부족"
    category: eligibility
    causal_layer: data
    tier: T2
    is_hard: true
    aliases: [WEEKEND_OFF_ONLY_DRAINS_WEEKDAY, WEEKDAY_SUPPLY_SHORTAGE]
    problem_template_ko: "주말 OFF 전용 간호사 {weekend_off_count}명으로 평일 가용 인원 {weekday_eligible}명이 평일 수요 {weekday_demand}명을 미충족."

  cause:eligibility:ban_n_before_fixed_off_isolates:
    label: "fixed OFF 직전 N 금지 + N 수요 충돌"
    category: eligibility
    causal_layer: structural
    tier: T2
    is_hard: true
    aliases: [BAN_N_BEFORE_FIXED_OFF_ISOLATES, FIXED_OFF_N_ISOLATION]
    problem_template_ko: "{day}일 N 수요 {n_required}명이 있으나 인접일 fixed OFF 가 있는 간호사 {blocked_nurses}명은 ban_n_before_fixed_off 로 N 배정 불가 → 가용 N 인력 {available_n}명 미달."

  cause:fixed:initial_forbidden_concentration:
    label: "fixed 차단 집중 — 실질 single-shift role 강제"
    category: fixed
    causal_layer: data
    tier: T1
    is_hard: true
    aliases: [INITIAL_FORBIDDEN_CONCENTRATION, ROLE_FROM_FIXED_FORBID]
    problem_template_ko: "간호사 {nurse_id} 가 {forbidden_shifts} 시프트 전 기간 차단 → 실질 {effective_role} 역할 강제, 그 결과 다른 shift 공급 부족."

  cause:config:monthly_limit_n_exact_unattainable:
    label: "월간 N 정확 값이 active 일수와 모순"
    category: config
    causal_layer: meta
    tier: T0
    is_hard: true
    aliases: [MONTHLY_LIMIT_N_EXACT_UNATTAINABLE, N_EXACT_INCOMPATIBLE]
    problem_template_ko: "간호사 {nurse_id} 의 N 정확({n_exact})이 active 일수 {active_days}일 또는 다른 제약과 양립 불가."


treatments:
  treatment:soft:grade_max:
    label: "Grade max 를 soft fallback"
    action_type: force_soft_mode
    target_family: GradeMax
    config_key: _force_grade_max_soft_fallback
    direction: enable
    rationale_ko: "등급 상한을 hard 에서 soft 로 전환. 일부 시프트에서 등급 한계 1~2명 초과 가능."
    trade_off_ko: "특정 (day, shift)에서 grade=N 간호사가 max 를 초과 가능. 다음 달 운영에서 보정 권장."
    applies_to_causes: [cause:grade:max_sum_below_need]

  treatment:soft:grade_min:
    label: "Grade min 을 soft fallback"
    action_type: force_soft_mode
    target_family: GradeMin
    config_key: _force_grade_min_soft_fallback
    direction: enable
    rationale_ko: "등급 최저 인원을 soft 화. 특정 day 에서 일부 등급이 1~2명 부족할 수 있음."
    trade_off_ko: "선임 grade 부족 시프트가 일부 발생 — 위험 시점 manual check 필요."
    applies_to_causes: [cause:grade:min_sum_over_need]

  treatment:soft:team_min:
    label: "팀 최소 인원을 soft fallback"
    action_type: force_soft_mode
    target_family: TeamMin
    config_key: team_min_soft_fallback
    direction: enable
    rationale_ko: "팀 최소 인원이 반드시 지켜지지 않을 수 있지만 최대한 충족하도록 노력합니다. 일부 시프트에서 팀 부족이 발생할 수 있습니다."
    trade_off_ko: "특정 시프트에서 팀 인원이 min 보다 1~2명 부족할 수 있음. 인계 시 주의 필요."
    applies_to_causes: [cause:team:min_over_need]

  treatment:disable:team_min:
    label: "팀 최소 인원 비활성화"
    action_type: disable_module
    target_family: TeamMin
    config_key: team_min_by_team
    direction: clear
    rationale_ko: "팀 단위 최소 인원 강제 완전 해제. 팀 균형이 daily coverage 차원으로만 보장됨."
    trade_off_ko: "팀별 시프트 안정성 보장 사라짐. 팀 운영 매뉴얼 보정 필수."
    applies_to_causes: [cause:team:size_insufficient, cause:team:min_over_need]

  treatment:disable:transition_ban:
    label: "전이 금지 비활성화"
    action_type: disable_module
    target_family: BoundaryTransitionBan
    config_key: ban_n_to_d
    direction: disable
    rationale_ko: "야간→주간 등 전이 금지 룰을 일시 해제. 인력 재구성 자유도 증가."
    trade_off_ko: "야간 직후 주간 출근 등 전이 발생 가능. 안전상 주의 필요."
    applies_to_causes:
      - cause:capacity:daily_night_shortage
      - cause:carryover:prev_month_n_tail_blocks_start
      - cause:transition:nod_pattern_forces_infeasibility

  treatment:disable:night_recovery:
    label: "야간 회복 OFF 강제 비활성화"
    action_type: disable_module
    target_family: NightRecovery
    config_key: two_offs_after_two_nig
    direction: disable
    rationale_ko: "2N→2OFF / 3N→2OFF 회복 OFF 강제를 비활성. 야간 후 즉시 다른 시프트 가능."
    trade_off_ko: "회복 시간 부족으로 피로 누적 위험 — 운영상 보정 필요."
    applies_to_causes:
      - cause:capacity:monthly_night_shortage
      - cause:recovery:two_n_two_off_blocks_demand
      - cause:recovery:three_n_two_off_blocks_demand

  treatment:threshold:coverage_min:
    label: "일 수요 하향 조정"
    action_type: set_threshold
    target_family: CoverageMin
    config_key: daily_shift_requirements
    direction: decrease
    rationale_ko: "일별 시프트 요구 인원을 1~2명 감소시켜 균형 회복."
    trade_off_ko: "해당 시프트의 환자 대응 마진 축소."
    applies_to_causes: [cause:capacity:daily_total_shortage]

  treatment:threshold:monthly_night_cap:
    label: "월간 N cap 상향"
    action_type: set_threshold
    target_family: MonthlyNightCap
    config_key: max_nig_per_month
    direction: increase
    rationale_ko: "개인당 월 최대 야간 횟수를 1 증가."
    trade_off_ko: "개인별 야간 부담 증가. 다음 달 분산으로 균형 회복 권장."
    applies_to_causes: [cause:capacity:monthly_night_shortage]

  treatment:threshold:team_min:
    label: "team_min 하향"
    action_type: set_threshold
    target_family: TeamMin
    config_key: team_min_by_team
    direction: decrease
    rationale_ko: "팀 단위 최소 인원을 1 감소."
    trade_off_ko: "특정 팀의 시프트 안정성 약화."
    applies_to_causes: [cause:team:min_over_need]

  treatment:scope:team_min_remove:
    label: "특정 팀의 team_min 만 제거"
    action_type: narrow_scope
    target_family: TeamMin
    config_key: team_min_by_team
    direction: remove_key
    rationale_ko: "전체 팀 일괄이 아닌 특정 팀의 team_min 만 해제. 다른 팀은 유지."
    trade_off_ko: "해당 팀의 안정성 일시 약화."
    applies_to_causes: [cause:team:min_over_need]

  treatment:data:fix_config:
    label: "Config 데이터 수정 (manual)"
    action_type: data_correction_required
    target_family: ConfigIntegrity
    config_key: null
    direction: manual
    rationale_ko: "Config 모순 — 사용자가 직접 데이터 보정. 예: grade min/max 재설정, MID 활성 여부 확인, 간호사 allowed_shifts 점검."
    trade_off_ko: "자동 해결 불가. 입력 검증 후 재요청 필요."
    applies_to_causes:
      - cause:config:mid_required_missing
      - cause:config:mid_disabled_but_used
      - cause:eligibility:nurse_isolated
      - cause:fixed:violates_eligibility
      - cause:config:grade_min_gt_max
      - cause:config:monthly_limit_contradiction
      - cause:dispatch:fixed_assign_wrong_group
      - cause:config:monthly_limit_n_exact_unattainable
      - cause:fixed:initial_forbidden_concentration

  treatment:data:reduce_fixed:
    label: "고정 셀 / 원티드 정리 (manual)"
    action_type: data_correction_required
    target_family: FixedWanted
    config_key: null
    direction: manual
    rationale_ko: "고정 셀(원티드/휴가/직접 배정)이 일 수요 또는 활성 일수를 초과. 일부 원티드 거절 또는 휴가 조정 필요."
    trade_off_ko: "자동 해결 불가. 원티드 양보 또는 휴가 재배치 필요."
    applies_to_causes:
      - cause:fixed:over_demand
      - cause:fixed:off_exceeds_span

  treatment:data:add_nurse:
    label: "간호사 추가 배치 또는 demand 영구 하향"
    action_type: data_correction_required
    target_family: ConfigIntegrity
    config_key: null
    direction: manual
    rationale_ko: "월 총 공급 < 수요 — 인력이 본질적으로 부족합니다. 추가 인력 배치 또는 daily_shift_requirements 의 영구 하향 필요. (단순 일시 인원 감축으론 다음 달도 동일 문제 재발)"
    trade_off_ko: "인력 보강 시 인건비 증가. demand 하향 시 환자 대응 마진 축소."
    applies_to_causes:
      - cause:capacity:monthly_total_shortage
      - cause:capacity:daily_total_shortage
      - cause:capacity:daily_night_shortage
      - cause:team:size_insufficient
      - cause:eligibility:shift_eligible_shortage
      - cause:dispatch:outbound_leaves_source_short

  treatment:undiagnosed:
    label: "자동 진단 불가 (UNDIAGNOSED)"
    action_type: data_correction_required
    target_family: ConfigIntegrity
    config_key: null
    direction: manual
    rationale_ko: "솔버는 infeasible 이지만 산술 / probe 가 cause 를 식별 못 함. evidence 의 raw validator output 을 기반으로 수동 분석 필요."
    trade_off_ko: "자동 추천 불가. 입력 데이터/제약 설정 종합 점검 필요."
    applies_to_causes: [cause:undiagnosed]

  # ─────────────────────────────────────────────────────────────────────
  # Dispatch 전용 treatment 2종 (모두 manual — 인사/협의 필요)
  # ─────────────────────────────────────────────────────────────────────
  treatment:data:adjust_dispatch_period:
    label: "파견 기간 조정 (manual, 인사 협의)"
    action_type: data_correction_required
    target_family: AssignmentWindow
    config_key: nurse_assignment
    direction: manual
    rationale_ko: "파견 기간(start_day/end_day) 또는 시작 시점을 조정하여 본 병동 활성 일수를 늘리거나, source 병동의 빈 자리 발생을 시간상 이동. 인사 부서·source/target 양 병동 협의 필요."
    trade_off_ko: "파견 일정 조정은 두 병동 운영에 동시 영향. source 병동의 인력 운용 재계획 필요. 협의 시간이 필요해 즉시 적용 어려움."
    applies_to_causes:
      - cause:dispatch:inbound_window_too_narrow
      - cause:dispatch:outbound_leaves_source_short

  treatment:data:reassign_dispatch_nurse:
    label: "파견 간호사 교체 (manual, 인사 협의)"
    action_type: data_correction_required
    target_family: AssignmentWindow
    config_key: nurse_assignment
    direction: manual
    rationale_ko: "현 파견 간호사 대신 본 병동 부족 시프트와 호환되는 다른 간호사로 교체. allowed_shifts 일치, group ownership 명확, fixed 배정 충돌 없는 후보 인사 협의."
    trade_off_ko: "교체 가능한 후보 간호사가 있는지 사전 확인 필요. source 병동의 인력 운용에도 영향."
    applies_to_causes:
      - cause:dispatch:inbound_shift_mask_incompatible
      - cause:dispatch:fixed_assign_wrong_group
      - cause:dispatch:inbound_window_too_narrow

  # ─────────────────────────────────────────────────────────────────────
  # Carryover / Preceptee / Consecutive 도메인 treatment
  # ─────────────────────────────────────────────────────────────────────
  treatment:data:adjust_carryover_input:
    label: "전월 schedule 의 carryover input 조정 (manual)"
    action_type: data_correction_required
    target_family: CarryoverBoundary
    config_key: prev_month_schedule
    direction: manual
    rationale_ko: "본 월 시작 day 차단의 원인인 전월 N tail / fixed neighbor 패턴을 데이터 차원에서 조정. 전월 발행된 schedule 의 마지막 며칠 또는 본 월 첫 fixed_wanted 재설정. 또는 NotOneNight bypass 명시."
    trade_off_ko: "전월 schedule 발행 후 수정은 운영상 부담. fixed 재설정은 사용자 동의 필요."
    applies_to_causes:
      - cause:carryover:prev_month_n_tail_blocks_start
      - cause:carryover:fixed_n_isolated_by_off_neighbors

  treatment:data:relax_preceptee_sync:
    label: "프리셉터-프리셉티 동기화 기간 조정 (manual)"
    action_type: data_correction_required
    target_family: PrecepteeSync
    config_key: preceptee_pair
    direction: manual
    rationale_ko: "동기화 기간 축소 또는 페어 재구성. 호환되는 가능 시프트/팀 intersection 이 비어있지 않도록 페어 변경 또는 양쪽 allowed_shifts 확장 검토."
    trade_off_ko: "동기화 단축은 교육 효과 저하 우려. 페어 재구성은 인사 조정 필요."
    applies_to_causes:
      - cause:preceptee:sync_window_mismatch

  treatment:threshold:consecutive_work:
    label: "max_consecutive_work 상한 조정"
    action_type: set_threshold
    target_family: ConsecutiveWorkLimit
    config_key: max_consecutive_work_days
    direction: increase
    rationale_ko: "연속 근무 한도를 1~2일 상향하여 windowed coverage 풀이 자유도 증가. 예: 5일 → 6일."
    trade_off_ko: "연속 근무일이 늘어나면 개인 피로 누적. 다음 달 OFF 배치로 보정 권장."
    applies_to_causes:
      - cause:consecutive:work_limit_blocks_coverage

  # ─────────────────────────────────────────────────────────────────────
  # Eligibility / Role 도메인 treatment
  # ─────────────────────────────────────────────────────────────────────
  treatment:disable:weekend_off_only:
    label: "주말 OFF 전용 정책 비활성화"
    action_type: disable_module
    target_family: WeekendOffOnly
    config_key: weekend_off_only_enable
    direction: disable
    rationale_ko: "주말 OFF 전용 간호사를 평일에도 배정 가능하게. 평일 공급 부족 해소."
    trade_off_ko: "기존 weekend-off 약속을 깸 — 개인 협의 필요. 다음 달 보정 권장."
    applies_to_causes:
      - cause:eligibility:weekend_off_only_drains_weekday

  treatment:disable:ban_night_before_fixed_off:
    label: "fixed OFF 직전 N 금지 비활성화"
    action_type: disable_module
    target_family: BanNightBeforeFixedOff
    config_key: ban_night_before_fixed_off
    direction: disable
    rationale_ko: "fixed OFF 인접일 N 금지 룰 해제. N 가용 인원 회복."
    trade_off_ko: "OFF 직전 N 배정 발생 가능 — 휴가 시작 직전 피로 누적 우려."
    applies_to_causes:
      - cause:eligibility:ban_n_before_fixed_off_isolates

  treatment:data:reassign_role_only:
    label: "Role-only 간호사 비율 재조정 (manual)"
    action_type: data_correction_required
    target_family: AllowedShiftMask
    config_key: allowed_shifts
    direction: manual
    rationale_ko: "N-only / D-only 등 single-shift role 간호사 일부의 allowed_shifts 를 확장하거나, 추가 인력 배치. 인사·간호부 협의."
    trade_off_ko: "Role 확장은 교육·자격 검토 필요. 즉시 적용 불가."
    applies_to_causes:
      - cause:eligibility:role_only_oversupply
      - cause:fixed:initial_forbidden_concentration

# ── 소프트 제약 카탈로그 ──────────────────────────────────────────────────────
# objective weight 로만 존재하던 소프트 제약을 온톨로지 1급으로 등재.
# weight_constant: hardcoded_weights.py 상수 / config_key: 런타임 control 노브
# lex_stage: fallback 3-stage 계층 (safety > quality; coverage 는 하드)
soft_constraints:
  night_deviation:
    label: 야간 분배 편차
    severity: soft
    weight_constant: NIGHT_DEVIATION_PENALTY
    config_key: night_minmax_primary_weight
    lex_stage: safety
    rationale_ko: "간호사 간 N 횟수 편차를 줄인다(공정성·피로 분산)."
    aliases: [NIGHT_DEVIATION]
  isolated_work:
    label: 고립 근무 (O W O)
    severity: soft
    weight_constant: ISOLATED_WORK_PENALTY
    config_key: isolated_work_penalty_weight
    lex_stage: safety
    rationale_ko: "OFF 사이 단일 근무(고립근무)를 억제한다."
    aliases: [ISOLATED_WORK]
  isolated_off:
    label: 고립 OFF (W O W)
    severity: soft
    weight_constant: ISOLATED_OFF_PENALTY
    config_key: isolated_off_penalty_weight
    lex_stage: quality
    rationale_ko: "근무 사이 단일 OFF(고립 OFF)를 억제한다."
    aliases: [ISOLATED_OFF]
  nod_noe:
    label: N-OFF-D / N-OFF-E 패턴
    severity: soft
    weight_constant: NOD_NOE_PENALTY
    config_key: nod_noe_penalty_weight
    lex_stage: safety
    rationale_ko: "야간 후 짧은 회복(NOD/NOE) 패턴을 억제한다."
    aliases: [NOD_NOE]
  experience_short:
    label: 경력 부족 커버
    severity: soft
    weight_constant: EXPERIENCE_SHORT_PENALTY
    config_key: experience_short_penalty_weight
    lex_stage: quality
    rationale_ko: "교대별 경력(숙련) 최소 확보 미달을 페널티화."
    aliases: [EXPERIENCE_SHORT]
  week_off_short:
    label: 주간 OFF 부족
    severity: soft
    weight_constant: WEEK_OFF_SHORT_PENALTY
    config_key: week_off_short_penalty_weight
    lex_stage: quality
    rationale_ko: "주 단위 최소 OFF 미달을 페널티화."
    aliases: [WEEK_OFF_SHORT]
  kld_distribution:
    label: 근무 분포 균등(KLD)
    severity: soft
    weight_constant: null
    config_key: kld_range_weight
    lex_stage: quality
    rationale_ko: "간호사 간 시프트 분포 균등화(KLD range)."
    aliases: [KLD_DISTRIBUTION]
