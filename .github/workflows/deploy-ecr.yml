name: Build - Push - Deploy (EC2 + ALB)

on:
  push:
    branches:
      - main
      - dev
      - feat/**

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # 1) 저장소 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) 브랜치에 따라 ENV / TAG / API KEY 세팅
      - name: Set dynamic env vars
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "ECR_REPO=aide-backend-prod" >> $GITHUB_ENV
            echo "EC2_HOST=${{ secrets.PROD_EC2_HOST }}" >> $GITHUB_ENV
            echo "PROD_DB_NAME=${{ secrets.PROD_DB_NAME }}" >> $GITHUB_ENV
            echo "PROD_DB_USER=${{ secrets.PROD_DB_USER }}" >> $GITHUB_ENV
            echo "PROD_DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "PROD_DB_HOST=${{ secrets.PROD_DB_HOST }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "DOCKER_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.PROD_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.PROD_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.PROD_ENV_OPENAI }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "DEV_REPO=aide-backend-dev" >> $GITHUB_ENV
            echo "EC2_HOST=${{ secrets.DEV_EC2_HOST }}" >> $GITHUB_ENV
            echo "DEV_DB_NAME=${{ secrets.DEV_DB_NAME }}" >> $GITHUB_ENV
            echo "DEV_DB_USER=${{ secrets.DEV_DB_USER }}" >> $GITHUB_ENV
            echo "DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DEV_DB_HOST=${{ secrets.DEV_DB_HOST }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.DEV_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.DEV_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.DEV_ENV_OPENAI }}" >> $GITHUB_ENV
          fi

      - name: Debug env
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "EC2_HOST=${{ env.EC2_HOST }}"
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ECR_REPO=${{ env.ECR_REPO }}"
          fi

      - name: Log Environment (safe)
        run: |
          echo "ENVIRONMENT=${{ env.ENVIRONMENT }}"
          echo "DOCKER_TAG=${{ env.DOCKER_TAG }}"

      # 3) AWS 자격 구성
      - name: Configure AWS credentials (AccessKey)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # # 4) ECR 로그인
      # - name: Login to Amazon ECR
      #   if: github.ref_name == 'main'
      #   id: ecr-login
      #   uses: aws-actions/amazon-ecr-login@v2

      # # 5) Docker 이미지 빌드/푸시
      # - name: Build Docker image
      #   if: github.ref_name == 'main'
      #   run: |
      #     docker build \
      #       --build-arg ENV=${{ env.ENVIRONMENT }} \
      #       --build-arg GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }} \
      #       --build-arg ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }} \
      #       --build-arg OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
      #       -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ env.DOCKER_TAG }} .

      # - name: Push Docker image to ECR
      #   if: github.ref_name == 'main'
      #   run: |
      #     docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ env.DOCKER_TAG }}

      # - name: Export image uri
      #   if: github.ref_name == 'main'
      #   run: |
      #     echo "IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ env.DOCKER_TAG }}" >> $GITHUB_ENV

      # # 5-0) ECR Lifecycle Policy 적용 (untagged 즉시 삭제, 태그된 건 최근 10개 유지)
      # - name: Apply ECR lifecycle policy (idempotent)
      #   if: github.ref_name == 'main'
      #   run: |
      #     cat > policy.json <<'JSON'
      #     {
      #       "rules": [
      #         {
      #           "rulePriority": 1,
      #           "description": "Expire untagged images quickly",
      #           "selection": {
      #             "tagStatus": "untagged",
      #             "countType": "sinceImagePushed",
      #             "countNumber": 1,
      #             "countUnit": "days"
      #           },
      #           "action": { "type": "expire" }
      #         },
      #         {
      #           "rulePriority": 2,
      #           "description": "Keep only the last 10 tagged images",
      #           "selection": {
      #             "tagStatus": "any",
      #             "countType": "imageCountMoreThan",
      #             "countNumber": 10
      #           },
      #           "action": { "type": "expire" }
      #         }
      #       ]
      #     }
      #     JSON
      #     aws ecr put-lifecycle-policy \
      #       --repository-name ${{ env.ECR_REPO }} \
      #       --lifecycle-policy-text file://policy.json \
      #       --region ${{ secrets.AWS_REGION }}

      # # 5-1) EC2 → ECR 로그인
      # - name: ECR login from EC2
      #   if: github.ref_name == 'main'
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ env.EC2_HOST }}
      #     username: ubuntu
      #     key: ${{ secrets.PROD_EC2_SSH_KEY }}
      #     script: |
      #       set -e
      #       aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
      #         | sudo docker login \
      #           --username AWS \
      #           --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      #       echo "ECR login on EC2 done"

      # 5-2) EC2: 로컬 컨테이너/이미지 정리 (볼륨 유지)
      - name: Stop & prune on EC2 (keep volumes)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e
            sudo docker ps -q | xargs -r sudo docker stop
            sudo docker ps -a -q | xargs -r sudo docker rm
            sudo docker images -q | xargs -r sudo docker rmi
            sudo docker system prune -af

      # # 5-3) EC2: 새 이미지 Pull
      # - name: Pull new image on EC2
      #   if: github.ref_name == 'main'
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ env.EC2_HOST }}
      #     username: ubuntu
      #     key: ${{ secrets.PROD_EC2_SSH_KEY }}
      #     envs: IMAGE_URI
      #     script: |
      #       set -e
      #       echo "docker pull ${IMAGE_URI}"
      #       sudo docker pull "${IMAGE_URI}"

      # 5-4) EC2: .env 작성/갱신
      - name: Write .env on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          envs: ENV
          script: |
            set -e
            mkdir -p /home/ubuntu/app
            if [[ "${{ env.ENV }}" == "prod" ]]; then
              echo "[INFO] Generating PROD .env"
              cat > /home/ubuntu/app/.env <<EOF
            ENVIRONMENT=production
            MS_DB_HOST=${{ secrets.PROD_MS_DB_HOST }}
            MS_DB_PORT=${{ secrets.PROD_MS_DB_PORT }}
            MS_DB_NAME=${{ secrets.PROD_MS_DB_NAME }}
            MS_DB_USER=${{ secrets.PROD_MS_DB_USER }}
            MS_DB_PASSWORD=${{ secrets.PROD_MS_DB_PASSWORD }}
            EUN_DB_NAME=${{ secrets.PROD_EUN_DB_NAME }}
            CLIENT_ID=${{ secrets.PROD_CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.PROD_CLIENT_SECRET }}
            SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
            ALGORITHM=${{ secrets.PROD_ALGORITHM }}
            EOF
              fi

              echo "/home/ubuntu/app/.env created for ${{ env.ENV }}"
      # # 5-5) 컨테이너 실행 (env-file + host-gateway)
      # - name: Run container
      #   if: github.ref_name == 'main'
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ env.EC2_HOST }}
      #     username: ubuntu
      #     key: ${{ secrets.PROD_EC2_SSH_KEY }}
      #     envs: IMAGE_URI
      #     script: |
      #       set -e
      #       sudo docker stop aide-server-prod || true
      #       sudo docker rm   aide-server-prod || true
      #       sudo docker run -d \
      #         --name aide-server-prod \
      #         --env-file /home/ubuntu/app/.env \
      #         --network host \
      #         --restart unless-stopped \
      #         --log-opt awslogs-create-group=true \
      #         --log-opt awslogs-region=ap-northeast-2 \
      #         --log-opt awslogs-group=/ecs/aide-server-prod \
      #         --log-opt awslogs-stream=aide-server-prod \
      #         -p 8000:8000 \
      #         "${IMAGE_URI}"
      #       echo "Started: http://$HOSTNAME:8000/health"
      # PROD 전용: EC2에서 직접 FastAPI 실행
      - name: Deploy to PROD EC2 (non-Docker)
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script_stop: false
          script: |
            set +e

            echo "PROD 배포 시작"

            mkdir -p /home/ubuntu/aide-backend-prod
            cd /home/ubuntu/aide-backend-prod

            if [ -d ".git" ]; then
              echo "git pull 실행"
              git fetch origin main
              git checkout main
              git pull origin main
            else
              git clone -b main ${{ secrets.REPO_URL }} .
            fi

            # Python 환경 구성
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # PROD 환경 변수 구성
            cat > /home/ubuntu/aide-backend-prod/.env <<EOF
            ENVIRONMENT=production
            MS_DB_HOST=${{ secrets.PROD_MS_DB_HOST }}
            MS_DB_PORT=${{ secrets.PROD_MS_DB_PORT }}
            MS_DB_NAME=${{ secrets.PROD_MS_DB_NAME }}
            MS_DB_USER=${{ secrets.PROD_MS_DB_USER }}
            MS_DB_PASSWORD=${{ secrets.PROD_MS_DB_PASSWORD }}
            EUN_DB_NAME=${{ secrets.PROD_EUN_DB_NAME }}
            CLIENT_ID=${{ secrets.PROD_CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.PROD_CLIENT_SECRET }}
            SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
            ALGORITHM=${{ secrets.PROD_ALGORITHM }}
            SQS_QUEUE_URL=https://sqs.ap-northeast-2.amazonaws.com/702166530338/roster-job-queue
            EOF

            chmod +x /home/ubuntu/aide-backend-prod/start.sh
            /home/ubuntu/aide-backend-prod/start.sh

            echo "PROD 배포 완료!"

      # 6) DEV 전용: Docker 없이 EC2에서 직접 실행
      - name: Deploy to DEV EC2 (non-Docker)
        if: github.ref_name == 'dev'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script_stop: false
          script: |
            set +e

            echo "DEV 배포 시작 (Docker 미사용)"

            # 1) 프로젝트 폴더 준비
            mkdir -p /home/ubuntu/aide-backend-dev
            cd /home/ubuntu/aide-backend-dev

            # 2) 저장소 업데이트 (첫 배포면 clone)
            if [ -d ".git" ]; then
              echo "git pull 실행"
              git fetch origin dev
              git checkout dev
              git pull origin dev
            else
              echo "repo clone 실행"
              git clone -b dev ${{ secrets.REPO_URL }} .
            fi

            # 3) Python 환경 준비
            echo "Python venv 준비"
            python3 -m venv venv
            source venv/bin/activate

            echo "pip install 실행"
            pip install --upgrade pip
            pip install -r requirements.txt

            # 4) DEV용 .env 생성
            echo "DEV .env 생성"
            cat > /home/ubuntu/aide-backend-dev/.env <<EOF
            ENVIRONMENT=development
            MS_DB_HOST=${{ secrets.DEV_MS_DB_HOST }}
            MS_DB_PORT=${{ secrets.DEV_MS_DB_PORT }}
            MS_DB_NAME=${{ secrets.DEV_MS_DB_NAME }}
            MS_DB_USER=${{ secrets.DEV_MS_DB_USER }}
            MS_DB_PASSWORD=${{ secrets.DEV_MS_DB_PASSWORD }}
            EUN_DB_NAME=${{ secrets.DEV_EUN_DB_NAME }}
            CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}
            CLIENT_SECRET=${{ secrets.DEV_CLIENT_SECRET }}
            SECRET_KEY=${{ secrets.DEV_SECRET_KEY }}
            ALGORITHM=${{ secrets.DEV_ALGORITHM }}
            SQS_QUEUE_URL=https://sqs.ap-northeast-2.amazonaws.com/702166530338/roster-job-queue
            EOF

            # 4) EC2의 start.sh 실행
            echo "start.sh 실행!"
            chmod +x /home/ubuntu/aide-backend-dev/start.sh
            /home/ubuntu/aide-backend-dev/start.sh

            echo "DEV 서버 배포 완료!"
            echo "http://${{ env.EC2_HOST }}:8000/health"
