<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="mGray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa0a6"/></marker>
    <marker id="mPurple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8430ce"/></marker>
    <marker id="mRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d93025"/></marker>
    <marker id="mGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#188038"/></marker>
    <marker id="mOrange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e8710a"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#ffffff"/>

  <text x="40" y="44" font-size="23" font-weight="700" fill="#202124">온톨로지 그래프 (예시 인스턴스) — build_unified_graph</text>
  <text x="40" y="69" font-size="13" fill="#5f6368">노드=엔티티/제약/원자, 엣지=타입있는 관계. 주말휴무 vs OFF상한 충돌 한 케이스를 그래프로.</text>

  <!-- ===== EDGES (behind) ===== -->
  <!-- belongs_to -->
  <path d="M286,222 L206,150" stroke="#9aa0a6" stroke-width="1.8" fill="none" marker-end="url(#mGray)"/>
  <text x="230" y="180" font-size="10.5" fill="#9aa0a6">belongs_to</text>
  <path d="M292,262 L214,330" stroke="#9aa0a6" stroke-width="1.8" fill="none" marker-end="url(#mGray)"/>
  <text x="222" y="300" font-size="10.5" fill="#9aa0a6">belongs_to</text>
  <!-- constrains (purple) -->
  <path d="M672,175 L410,228" stroke="#8430ce" stroke-width="2" fill="none" marker-end="url(#mPurple)"/>
  <text x="520" y="188" font-size="10.5" fill="#8430ce">constrains</text>
  <path d="M690,198 L398,412" stroke="#8430ce" stroke-width="2" fill="none" marker-end="url(#mPurple)"/>
  <text x="540" y="330" font-size="10.5" fill="#8430ce">constrains</text>
  <path d="M686,372 L406,252" stroke="#8430ce" stroke-width="2" fill="none" marker-end="url(#mPurple)"/>
  <text x="520" y="330" font-size="10.5" fill="#8430ce">constrains</text>
  <!-- 구성(compose) dotted -->
  <path d="M398,246 L478,330" stroke="#bdc1c6" stroke-width="1.6" fill="none" stroke-dasharray="2 3"/>
  <text x="392" y="300" font-size="10" fill="#9aa0a6">구성</text>
  <path d="M398,424 L480,356" stroke="#bdc1c6" stroke-width="1.6" fill="none" stroke-dasharray="2 3"/>
  <!-- pressures (orange) cell->OffCap -->
  <path d="M606,342 L688,372" stroke="#e8710a" stroke-width="1.8" fill="none" marker-end="url(#mOrange)"/>
  <text x="612" y="345" font-size="10.5" fill="#e8710a">pressures</text>
  <!-- involves (red dashed) conflict->constraints -->
  <path d="M912,158 L854,172" stroke="#d93025" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#mRed)"/>
  <path d="M958,180 L820,360" stroke="#d93025" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#mRed)"/>
  <text x="905" y="290" font-size="10.5" fill="#d93025">involves</text>
  <!-- relaxes (green) treatment->constraint -->
  <path d="M936,306 L832,192" stroke="#188038" stroke-width="2" fill="none" marker-end="url(#mGreen)"/>
  <text x="852" y="258" font-size="10.5" fill="#188038">relaxes</text>

  <!-- ===== NODES ===== -->
  <!-- entities (ellipse, blue) -->
  <g><ellipse cx="150" cy="130" rx="62" ry="28" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="150" y="127" font-size="12" font-weight="600" fill="#174ea6" text-anchor="middle">팀 1</text>
    <text x="150" y="143" font-size="9.5" fill="#5f6368" text-anchor="middle">team</text></g>
  <g><ellipse cx="150" cy="345" rx="72" ry="28" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="150" y="342" font-size="12" font-weight="600" fill="#174ea6" text-anchor="middle">등급 senior</text>
    <text x="150" y="358" font-size="9.5" fill="#5f6368" text-anchor="middle">grade</text></g>
  <g><ellipse cx="342" cy="237" rx="66" ry="31" fill="#D2E3FC" stroke="#1a73e8" stroke-width="1.9"/>
    <text x="342" y="234" font-size="12.5" font-weight="700" fill="#174ea6" text-anchor="middle">간호사 A</text>
    <text x="342" y="250" font-size="9.5" fill="#5f6368" text-anchor="middle">nurse</text></g>
  <g><ellipse cx="330" cy="432" rx="74" ry="28" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="330" y="429" font-size="12" font-weight="600" fill="#174ea6" text-anchor="middle">12일 · 주말</text>
    <text x="330" y="445" font-size="9.5" fill="#5f6368" text-anchor="middle">day</text></g>
  <!-- atom (cell) -->
  <g><rect x="478" y="318" width="128" height="46" rx="7" fill="#F1F3F4" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="542" y="338" font-size="11.5" font-weight="600" fill="#3c4043" text-anchor="middle">cell (A·12·N)</text>
    <text x="542" y="353" font-size="9.5" fill="#5f6368" text-anchor="middle">assignment atom</text></g>
  <!-- constraints (rect, purple) -->
  <g><rect x="672" y="144" width="182" height="54" rx="9" fill="#F3E8FD" stroke="#8430ce" stroke-width="1.9"/>
    <text x="763" y="167" font-size="12.5" font-weight="700" fill="#6b1fb1" text-anchor="middle">WeekendOffOnly</text>
    <text x="763" y="184" font-size="9.5" fill="#5f6368" text-anchor="middle">ConstraintNode · severity:hard</text></g>
  <g><rect x="686" y="354" width="150" height="52" rx="9" fill="#F3E8FD" stroke="#8430ce" stroke-width="1.9"/>
    <text x="761" y="376" font-size="12.5" font-weight="700" fill="#6b1fb1" text-anchor="middle">OffCap</text>
    <text x="761" y="393" font-size="9.5" fill="#5f6368" text-anchor="middle">ConstraintNode</text></g>
  <!-- conflict scenario (orange dashed) -->
  <g><rect x="908" y="120" width="212" height="58" rx="10" fill="#FEEFE3" stroke="#e8710a" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1014" y="143" font-size="12" font-weight="700" fill="#a8500a" text-anchor="middle">OFFCAP_VS_WEEKEND_OFF</text>
    <text x="1014" y="160" font-size="9.5" fill="#5f6368" text-anchor="middle">conflict_scenario (N항)</text></g>
  <!-- treatment (green) -->
  <g><rect x="908" y="300" width="212" height="58" rx="10" fill="#E6F4EA" stroke="#188038" stroke-width="1.7"/>
    <text x="1014" y="323" font-size="12" font-weight="700" fill="#0d652d" text-anchor="middle">disable_weekend_off_only</text>
    <text x="1014" y="340" font-size="9.5" fill="#5f6368" text-anchor="middle">treatment · key=weekend_off_only_enable</text></g>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="500" width="1160" height="130" rx="10" fill="#fafafa" stroke="#dadce0" stroke-width="1"/>
  <text x="60" y="526" font-size="13" font-weight="700" fill="#3c4043">범례</text>
  <!-- node types -->
  <text x="60" y="552" font-size="11.5" font-weight="600" fill="#5f6368">노드:</text>
  <ellipse cx="120" cy="548" rx="16" ry="10" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.4"/><text x="142" y="552" font-size="11.5" fill="#3c4043">엔티티(간호사·팀·등급·시프트·일·연차)</text>
  <rect x="392" y="540" width="30" height="16" rx="4" fill="#F1F3F4" stroke="#5f6368" stroke-dasharray="3 2"/><text x="428" y="552" font-size="11.5" fill="#3c4043">원자 cell</text>
  <rect x="520" y="540" width="30" height="16" rx="4" fill="#F3E8FD" stroke="#8430ce"/><text x="556" y="552" font-size="11.5" fill="#3c4043">제약(family)</text>
  <rect x="672" y="540" width="30" height="16" rx="4" fill="#FEEFE3" stroke="#e8710a" stroke-dasharray="4 3"/><text x="708" y="552" font-size="11.5" fill="#3c4043">충돌 시나리오</text>
  <rect x="836" y="540" width="30" height="16" rx="4" fill="#E6F4EA" stroke="#188038"/><text x="872" y="552" font-size="11.5" fill="#3c4043">완화 treatment</text>
  <!-- edge types -->
  <text x="60" y="592" font-size="11.5" font-weight="600" fill="#5f6368">엣지:</text>
  <line x1="108" y1="588" x2="150" y2="588" stroke="#9aa0a6" stroke-width="1.8"/><text x="156" y="592" font-size="11.5" fill="#3c4043">belongs_to</text>
  <line x1="270" y1="588" x2="312" y2="588" stroke="#bdc1c6" stroke-width="1.6" stroke-dasharray="2 3"/><text x="318" y="592" font-size="11.5" fill="#3c4043">구성(nurse×day×shift)</text>
  <line x1="510" y1="588" x2="552" y2="588" stroke="#8430ce" stroke-width="2"/><text x="558" y="592" font-size="11.5" fill="#3c4043">constrains / requires</text>
  <line x1="740" y1="588" x2="782" y2="588" stroke="#e8710a" stroke-width="1.8"/><text x="788" y="592" font-size="11.5" fill="#3c4043">pressures(원자→제약)</text>
  <line x1="978" y1="588" x2="1020" y2="588" stroke="#d93025" stroke-width="1.8" stroke-dasharray="5 4"/><text x="1026" y="592" font-size="11.5" fill="#3c4043">involves(충돌)</text>
  <line x1="60" y1="616" x2="102" y2="616" stroke="#188038" stroke-width="2"/><text x="108" y="620" font-size="11.5" fill="#3c4043">relaxes(treatment→제약, config_key로 완화)</text>
  <text x="440" y="620" font-size="11" fill="#80868b">※ 실제 그래프는 build_unified_graph가 런타임 생성 · /ontology/graph 로 노출. 이 그림은 1개 충돌 예시 인스턴스.</text>
</svg>
