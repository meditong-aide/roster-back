<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 795" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a73e8"/></marker>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#188038"/></marker>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker>
    <marker id="aOrange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e8710a"/></marker>
    <marker id="aPurple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8430ce"/></marker>
  </defs>

  <rect x="0" y="0" width="1400" height="795" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#202124">AIDE 간호 근무표 서비스 · 인프라 아키텍처</text>
  <text x="40" y="66" font-size="13.5" fill="#5f6368">데이터 주권 국내: 애플리케이션·연산은 AWS 서울, 데이터베이스는 Naver Cloud · 외부 SaaS/온프렘은 별도 연동</text>

  <!-- ===================== ZONES ===================== -->
  <rect x="235" y="92" width="775" height="545" rx="14" fill="#fff8f0" stroke="#ff9900" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="255" y="118" font-size="15" font-weight="700" fill="#b26a00">AWS · 서울 리전 (ap-northeast-2)</text>

  <rect x="1045" y="232" width="325" height="126" rx="14" fill="#f0fff6" stroke="#03c75a" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1062" y="256" font-size="15" font-weight="700" fill="#03a04a">Naver Cloud · 국내 CSP</text>

  <rect x="1045" y="398" width="325" height="340" rx="14" fill="#fafafa" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1062" y="422" font-size="15" font-weight="700" fill="#5f6368">외부 SaaS / 온프렘 연동</text>

  <!-- ===================== EDGES ===================== -->

  <!-- Blue spine (y=295) -->
  <path d="M195,295 L259,295" stroke="#1a73e8" stroke-width="2.2" fill="none" marker-end="url(#aBlue)"/>
  <path d="M380,295 L427,295" stroke="#1a73e8" stroke-width="2.2" fill="none" marker-end="url(#aBlue)"/>
  <path d="M580,295 L625,295" stroke="#1a73e8" stroke-width="2.2" fill="none" marker-end="url(#aBlue)"/>
  <text x="602" y="286" font-size="11" fill="#1a73e8" text-anchor="middle">enqueue</text>
  <path d="M743,295 L785,295" stroke="#1a73e8" stroke-width="2.2" fill="none" marker-end="url(#aBlue)"/>

  <!-- Green DB access -->
  <path d="M933,295 L1069,295" stroke="#188038" stroke-width="2.2" fill="none" marker-end="url(#aGreen)"/>
  <text x="1000" y="286" font-size="11" fill="#188038" text-anchor="middle">결과 저장</text>
  <!-- EC2 direct R/W in its own clear lane (y=225) -->
  <path d="M527,267 L527,225 L1300,225 L1300,264" stroke="#188038" stroke-width="2.2" fill="none" marker-end="url(#aGreen)"/>
  <text x="720" y="218" font-size="11.5" fill="#188038" text-anchor="middle">EC2 직접 R/W (pymssql)</text>

  <!-- Purple CI / deploy (dashed) -->
  <path d="M195,164 L427,164" stroke="#8430ce" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <text x="311" y="154" font-size="11" fill="#8430ce" text-anchor="middle">build · push</text>
  <path d="M488,190 L488,264" stroke="#8430ce" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <path d="M580,164 L858,164 L858,264" stroke="#8430ce" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <text x="705" y="155" font-size="11" fill="#8430ce" text-anchor="middle">image pull</text>

  <!-- Orange external (trunk + branches, lane y=360) -->
  <path d="M563,323 L563,360 L1022,360 L1022,634" stroke="#e8710a" stroke-width="2" fill="none"/>
  <text x="648" y="352" font-size="11" fill="#e8710a" text-anchor="middle">외부 연동</text>
  <path d="M1022,460 L1068,460" stroke="#e8710a" stroke-width="2" fill="none" marker-end="url(#aOrange)"/>
  <path d="M1022,519 L1068,519" stroke="#e8710a" stroke-width="2" fill="none" marker-end="url(#aOrange)"/>
  <path d="M1022,573 L1068,573" stroke="#e8710a" stroke-width="2" fill="none" marker-end="url(#aOrange)"/>
  <path d="M1022,634 L1068,634" stroke="#e8710a" stroke-width="2" fill="none" marker-end="url(#aOrange)"/>

  <!-- Gray analytics + logs (dashed) -->
  <path d="M452,323 L360,464" stroke="#5f6368" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="348" y="400" font-size="11" fill="#5f6368" text-anchor="end">이벤트·콜 로그</text>
  <path d="M486,323 L508,464" stroke="#5f6368" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <path d="M410,494 L449,494" stroke="#5f6368" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <path d="M570,494 L609,494" stroke="#5f6368" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <!-- EC2 -> CloudWatch (orthogonal, lane y=440) -->
  <path d="M524,323 L524,440 L820,440 L820,464" stroke="#5f6368" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <!-- Lambda -> CloudWatch -->
  <path d="M860,323 L873,464" stroke="#5f6368" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="905" y="404" font-size="11" fill="#5f6368">logs</text>

  <!-- ===================== NODES ===================== -->
  <!-- User -->
  <g><rect x="55" y="267" width="140" height="56" rx="9" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.4"/>
    <text x="125" y="291" font-size="13.5" font-weight="600" fill="#174ea6" text-anchor="middle">간호 관리자</text>
    <text x="125" y="309" font-size="11" fill="#5f6368" text-anchor="middle">웹 클라이언트</text></g>

  <!-- GitHub Actions -->
  <g><rect x="55" y="138" width="140" height="52" rx="9" fill="#F3E8FD" stroke="#8430ce" stroke-width="1.4"/>
    <text x="125" y="161" font-size="12.5" font-weight="600" fill="#6b1fb1" text-anchor="middle">GitHub Actions</text>
    <text x="125" y="178" font-size="10.5" fill="#5f6368" text-anchor="middle">CI/CD</text></g>

  <!-- ALB -->
  <g><rect x="262" y="267" width="118" height="56" rx="9" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.4"/>
    <text x="321" y="291" font-size="13" font-weight="600" fill="#174ea6" text-anchor="middle">ALB</text>
    <text x="321" y="309" font-size="10.5" fill="#5f6368" text-anchor="middle">HTTPS / TLS</text></g>

  <!-- EC2 -->
  <g><rect x="430" y="267" width="150" height="56" rx="9" fill="#E8F0FE" stroke="#1a73e8" stroke-width="1.9"/>
    <text x="505" y="291" font-size="13" font-weight="700" fill="#174ea6" text-anchor="middle">EC2 · FastAPI</text>
    <text x="505" y="309" font-size="10.5" fill="#5f6368" text-anchor="middle">앱 컨테이너 (Docker)</text></g>

  <!-- SQS -->
  <g><rect x="628" y="267" width="115" height="56" rx="9" fill="#E6F4EA" stroke="#188038" stroke-width="1.4"/>
    <text x="685" y="291" font-size="13" font-weight="600" fill="#0d652d" text-anchor="middle">SQS</text>
    <text x="685" y="309" font-size="10.5" fill="#5f6368" text-anchor="middle">job queue</text></g>

  <!-- Lambda -->
  <g><rect x="788" y="267" width="145" height="56" rx="9" fill="#E6F4EA" stroke="#188038" stroke-width="1.4"/>
    <text x="860" y="291" font-size="13" font-weight="600" fill="#0d652d" text-anchor="middle">Lambda · 솔버</text>
    <text x="860" y="309" font-size="10.5" fill="#5f6368" text-anchor="middle">CP-SAT + LNS</text></g>

  <!-- ECR -->
  <g><rect x="430" y="138" width="150" height="52" rx="9" fill="#F1F3F4" stroke="#5f6368" stroke-width="1.4"/>
    <text x="505" y="160" font-size="12.5" font-weight="600" fill="#3c4043" text-anchor="middle">ECR</text>
    <text x="505" y="177" font-size="10.5" fill="#5f6368" text-anchor="middle">컨테이너 레지스트리</text></g>

  <!-- Firehose -->
  <g><rect x="280" y="468" width="130" height="52" rx="9" fill="#F1F3F4" stroke="#5f6368" stroke-width="1.4"/>
    <text x="345" y="490" font-size="12" font-weight="600" fill="#3c4043" text-anchor="middle">Kinesis Firehose</text>
    <text x="345" y="507" font-size="10" fill="#5f6368" text-anchor="middle">이벤트 스트림</text></g>

  <!-- S3 -->
  <g><rect x="452" y="468" width="118" height="52" rx="9" fill="#F1F3F4" stroke="#5f6368" stroke-width="1.4"/>
    <text x="511" y="490" font-size="12.5" font-weight="600" fill="#3c4043" text-anchor="middle">S3</text>
    <text x="511" y="507" font-size="10" fill="#5f6368" text-anchor="middle">공유 · 분석 저장</text></g>

  <!-- Athena -->
  <g><rect x="612" y="468" width="130" height="52" rx="9" fill="#F1F3F4" stroke="#5f6368" stroke-width="1.4"/>
    <text x="677" y="490" font-size="12.5" font-weight="600" fill="#3c4043" text-anchor="middle">Athena</text>
    <text x="677" y="507" font-size="10" fill="#5f6368" text-anchor="middle">쿼리 분석</text></g>

  <!-- CloudWatch -->
  <g><rect x="792" y="468" width="165" height="52" rx="9" fill="#F1F3F4" stroke="#5f6368" stroke-width="1.4"/>
    <text x="874" y="490" font-size="12.5" font-weight="600" fill="#3c4043" text-anchor="middle">CloudWatch Logs</text>
    <text x="874" y="507" font-size="10" fill="#5f6368" text-anchor="middle">관측성</text></g>

  <!-- MSSQL (NCP) -->
  <g><rect x="1072" y="267" width="270" height="56" rx="10" fill="#CEEAD6" stroke="#188038" stroke-width="1.9"/>
    <text x="1207" y="291" font-size="13.5" font-weight="700" fill="#0d652d" text-anchor="middle">Cloud DB for MSSQL</text>
    <text x="1207" y="311" font-size="10.5" fill="#3c4043" text-anchor="middle">eun_gw · eun_roster (고가용성)</text></g>

  <!-- External nodes -->
  <g><rect x="1070" y="436" width="278" height="48" rx="9" fill="#FEEFE3" stroke="#e8710a" stroke-width="1.4"/>
    <text x="1209" y="455" font-size="12.5" font-weight="600" fill="#a8500a" text-anchor="middle">LLM API</text>
    <text x="1209" y="472" font-size="10.5" fill="#5f6368" text-anchor="middle">OpenAI · Anthropic · Gemini</text></g>

  <g><rect x="1070" y="498" width="278" height="42" rx="9" fill="#FEEFE3" stroke="#e8710a" stroke-width="1.4"/>
    <text x="1209" y="524" font-size="12" font-weight="600" fill="#a8500a" text-anchor="middle">Daum SMTP · 이메일</text></g>

  <g><rect x="1070" y="552" width="278" height="42" rx="9" fill="#FEEFE3" stroke="#e8710a" stroke-width="1.4"/>
    <text x="1209" y="578" font-size="12" font-weight="600" fill="#a8500a" text-anchor="middle">Slack Webhook · 운영 알림</text></g>

  <g><rect x="1070" y="606" width="278" height="56" rx="9" fill="#FEEFE3" stroke="#e8710a" stroke-width="1.4"/>
    <text x="1209" y="629" font-size="12" font-weight="600" fill="#a8500a" text-anchor="middle">Meditong 그룹웨어 (온프렘)</text>
    <text x="1209" y="647" font-size="10.5" fill="#5f6368" text-anchor="middle">SMS · 앱푸시 · link.meditong.com</text></g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="11.5" fill="#3c4043">
    <line x1="255" y1="762" x2="285" y2="762" stroke="#1a73e8" stroke-width="2.2"/>
    <text x="292" y="766">요청·처리 흐름</text>
    <line x1="410" y1="762" x2="440" y2="762" stroke="#188038" stroke-width="2.2"/>
    <text x="447" y="766">DB 접근 (MSSQL)</text>
    <line x1="580" y1="762" x2="610" y2="762" stroke="#5f6368" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="617" y="766">로그·분석</text>
    <line x1="720" y1="762" x2="750" y2="762" stroke="#e8710a" stroke-width="2"/>
    <text x="757" y="766">외부 연동</text>
    <line x1="850" y1="762" x2="880" y2="762" stroke="#8430ce" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="887" y="766">배포 (CI/CD)</text>
  </g>
</svg>
